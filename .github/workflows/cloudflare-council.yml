name: Cloudflare D1 Council gate
on:
  push:
    branches:
      - 'build/cloudflare-*'
    paths:
      - 'cloudflare/**'
      - 'live/vendor/ultrathink-council/**'
      - '.github/workflows/cloudflare-council.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-council.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-council-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify SQLite/D1 transaction and authorization contracts
        run: python3 cloudflare/tests/test_schema.py -v
      - name: Install isolated Cloudflare dependencies
        working-directory: cloudflare
        run: npm install
      - name: Verify Council and Access contracts
        working-directory: cloudflare
        run: npm test
      - name: Dry-run bundle, no deployment
        working-directory: cloudflare
        run: npm run check:build
      - name: Retain exact Wrangler preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: think-tank-cloudflare-bundle-${{ github.sha }}
          path: cloudflare/.dry-run/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Install Chromium
        working-directory: cloudflare
        run: npx playwright install --with-deps chromium
      - name: Verify live Wrangler-served UI and auth denial
        working-directory: cloudflare
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Verify isolated preview is Access-protected
        env:
          PREVIEW_URL: https://think-tank-council-preview.mcgill-raylene.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          for path in / /api/me; do
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS --max-time 20 --connect-timeout 10 -D "$headers" -o "$body" -w '%{http_code}' "$PREVIEW_URL$path")"
            echo "$path -> HTTP $status"
            if [ "$status" != "302" ]; then
              echo "Expected Cloudflare Access redirect, got $status"
              sed -n '1,20p' "$headers"
              sed -n '1,8p' "$body"
              exit 1
            fi
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            case "$location" in
              https://jussray.cloudflareaccess.com/*) ;;
              *)
                echo "Unexpected redirect target: $location"
                exit 1
                ;;
            esac
          done
      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: think-tank-cloudflare-visual-${{ github.sha }}
          path: cloudflare/test-results/visual-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Production dependency audit
        working-directory: cloudflare
        run: npm audit --omit=dev --audit-level=high
