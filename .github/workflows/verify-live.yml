name: verify-live

# Cloudflare publishes the canonical public product through the dedicated
# think-tank-public-front-door Worker, which serves the same inspected artifact
# via a service binding to the protected think-tank origin Worker. Workers Builds
# remains the origin deployer; never run deploy-worker.yml concurrently with it.
# Regardless of deployment path, this independent proof re-fetches and hashes every
# live file listed in the runtime manifest artifactFileHashes; a deploy is not evidence.
#
# Manual by design. A deploy is not evidence of a correct public runtime, and
# this workflow is what turns "intended" into verified in PUBLIC_FACE.md.

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact commit SHA the live site must report
        required: true
        type: string
      live_url:
        description: Base URL to verify
        required: true
        default: https://thinktank.jussco.company
        type: string

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a malformed SHA
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_head_sha must be a full 40-character SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build trusted artifact from the checked-out exact source
        shell: bash
        env:
          THINK_TANK_SOURCE_SHA: ${{ inputs.expected_head_sha }}
          THINK_TANK_EXPECTED_SHA: ${{ inputs.expected_head_sha }}
          THINK_TANK_RUNTIME_ENV: cloudflare-workers
        run: |
          set -euo pipefail
          npm install
          npm run build
          npm run check:storage-boundary
          npm run check:domain-purity
          npm run test:unit
      # Default to the anonymous public front-door to verify the complete product.
      # Operators may explicitly select the protected origin only with an
      # authorized Access session; neither target grants deployment authority.
      - name: Verify live bytes against trusted source artifact
        shell: bash
        env:
          THINK_TANK_EXPECTED_SHA: ${{ inputs.expected_head_sha }}
          THINK_TANK_EXPECTED_ENV: cloudflare-workers
          THINK_TANK_TRUSTED_MANIFEST_FILE: _site/version.json
          LIVE_URL: ${{ inputs.live_url }}
        run: |
          set -euo pipefail
          node scripts/verify-live-runtime.mjs "$LIVE_URL"
