name: Playwright proof

on:
  push:
    branches:
      - main
      - 'build/**'
  pull_request:

jobs:
  interview-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check:storage-boundary
      - run: npm run check:domain-purity
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Source runtime Playwright
        run: npm run test:e2e
      - name: Offline file sovereignty Playwright
        run: npm run test:e2e:file
      - name: Build inspected static artifact
        run: npm run build:static
      - name: Packaged runtime Playwright
        run: npm run test:e2e:artifact
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
