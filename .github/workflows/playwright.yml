name: Playwright proof

on:
  push:
    branches:
      - main
      - 'build/**'
  pull_request:

concurrency:
  group: playwright-proof-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interview-loop:
    # Playwright 1.55 Chromium install supports Ubuntu 24.04, not runner Ubuntu 26.04.
    runs-on: ubuntu-24.04
    # Budget includes rebuilding patched Git and all three browser proof suites.
    timeout-minutes: 25
    env:
      PROOF_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Install upstream Git security release before checkout
        uses: jussray/founder-control-room/.github/actions/refresh-git-security@0a739664e85443fb79cfe58202e2eea6ce01d7ff
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_SUBJECT_SHA }}
      - name: Bind proof checkout to exact subject
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$PROOF_SUBJECT_SHA"
          echo "Exact proof subject verified: $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check:storage-boundary
      - run: npm run check:domain-purity
      - run: npm run test:unit
      - name: Bundle public Worker with Wrangler (dry-run only)
        run: npx wrangler deploy --dry-run --config wrangler.frontdoor.jsonc --outdir /tmp/think-tank-worker-bundle
      - run: npx playwright install --with-deps chromium
      - name: Source runtime Playwright
        run: npm run test:e2e
      - name: Build inspected static artifact
        env:
          THINK_TANK_SOURCE_SHA: ${{ env.PROOF_SUBJECT_SHA }}
          THINK_TANK_RUNTIME_ENV: ci-proof
        run: npm run build:static
      - name: Verify runtime manifest identity
        env:
          THINK_TANK_EXPECTED_SHA: ${{ env.PROOF_SUBJECT_SHA }}
        run: npm run check:runtime-manifest
      - name: Offline packaged file sovereignty Playwright
        run: npm run test:e2e:file
      - name: Packaged runtime Playwright
        run: npm run test:e2e:artifact
      - name: Attach desktop and mobile visual receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: think-tank-visual-proof
          path: visual-proof/*.png
          if-no-files-found: warn
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
            _site/version.json
          if-no-files-found: ignore
