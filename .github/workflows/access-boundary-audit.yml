name: Think Tank Access Boundary (read-only)

on:
  pull_request:
  push:
    branches:
      - main
      - fix/think-tank-access-boundary-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Verify exact source contract (no Cloudflare credentials)
        run: |
          set -euo pipefail
          node --check scripts/access-boundary-contract.mjs
          node --check scripts/verify-access-boundary.mjs
          node --test tests/scripts/access-boundary-contract.test.js tests/scripts/public-access-docs.test.js tests/scripts/live-origin-policy.test.js
      - name: Run complete Node unit and static artifact acceptance checks
        env:
          THINK_TANK_SOURCE_SHA: ${{ github.sha }}
          THINK_TANK_EXPECTED_SHA: ${{ github.sha }}
          THINK_TANK_RUNTIME_ENV: cloudflare-workers
        run: |
          set -euo pipefail
          npm run test:unit
          npm run build
          npm run check:storage-boundary
          npm run check:domain-purity

  live-configuration-audit:
    if: github.event_name == 'workflow_dispatch'
    needs: source-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Read-only Cloudflare Access policy audit
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/verify-access-boundary.mjs
