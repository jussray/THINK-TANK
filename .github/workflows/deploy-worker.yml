name: deploy-worker

# Deploys the Think Tank Worker from this repository's own gated build.
#
# Why this exists: the Cloudflare Workers Builds git integration has failed on
# every main head since d378f32 within about a second of starting, and its build
# log is only readable in the Cloudflare dashboard. This workflow runs the same
# gates locally in CI, then publishes the gated _site artifact with the pinned
# project-local Wrangler CLI.
#
# Trigger: push to main (that is, after a merge) or manual dispatch. An open pull
# request does not deploy. This workflow does not approve, merge, or prove the
# live site; verify-live.yml remains the proof step.
#
# Requires two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Disconnect the Workers Builds git integration in the dashboard before relying on
# this path, so that exactly one system deploys the Worker.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-think-tank
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (Wrangler pinned in package.json)
        run: npm install --no-audit --no-fund
      - name: Build and gate the exact commit
        env:
          THINK_TANK_SOURCE_SHA: ${{ github.sha }}
          THINK_TANK_RUNTIME_ENV: cloudflare-workers
        run: |
          set -euo pipefail
          npm run build
          npm run check:storage-boundary
          npm run check:domain-purity
          npm run test:unit
      - name: Refuse to deploy without credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }
      - name: Deploy the gated _site artifact
        run: npx wrangler deploy
