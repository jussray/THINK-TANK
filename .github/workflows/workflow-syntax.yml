name: Workflow syntax guard

# Runs for every workflow modification, including new branches. Validation is
# independent of verify-live.yml so an invalid live verifier cannot silently pass.
on:
  push:
    paths:
      - '.github/workflows/**'
      - 'tests/scripts/verify-live-workflow.test.js'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/scripts/verify-live-workflow.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Validate all GitHub Actions workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard the independent live-verification step
        run: node --test tests/scripts/verify-live-workflow.test.js
